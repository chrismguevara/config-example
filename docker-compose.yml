# Full stack: Postgres -> Liquibase (runs to completion) -> Go API -> Vite dev server.
#
#   docker compose up --build
#   open http://localhost:5173
#
# Re-run migrations only:  docker compose run --rm liquibase
# Roll back one changeset: docker compose run --rm liquibase rollback-count 1
# Status:                  docker compose run --rm liquibase status --verbose
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: settings
      POSTGRES_USER: settings
      POSTGRES_PASSWORD: settings
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U settings -d settings"]
      interval: 2s
      timeout: 3s
      retries: 30

  liquibase:
    image: liquibase/liquibase:4.29
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://postgres:5432/settings
      LIQUIBASE_COMMAND_USERNAME: settings
      LIQUIBASE_COMMAND_PASSWORD: settings
      LIQUIBASE_COMMAND_CHANGELOG_FILE: changelog/changelog-master.yaml
      LIQUIBASE_SEARCH_PATH: /liquibase/changelog
      LIQUIBASE_LOG_LEVEL: info
    volumes:
      - ./db:/liquibase/changelog:ro
    # `dev` context seeds three v1 users so the v2..v4 data migrations have something to migrate.
    command: ["update", "--contexts=dev"]

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      liquibase:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://settings:settings@postgres:5432/settings?sslmode=disable
      PORT: "8080"
    ports:
      - "8080:8080"

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - api
    environment:
      VITE_API_PROXY_TARGET: http://api:8080
    ports:
      - "5173:5173"

volumes:
  pgdata:
